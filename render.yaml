databases:
  - name: fic_db
    plan: free
    databaseName: fic
    user: fic_user

services:
  - type: web
    plan: free
    name: fic
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn fic.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fic_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4